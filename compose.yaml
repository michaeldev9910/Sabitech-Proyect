name: sabitech-despliegue

services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      # Por defecto solo desde este PC. Para el móvil: IP_FRONTEND=0.0.0.0
      - "${IP_FRONTEND:-127.0.0.1}:5173:5173" # puerto de conexion al movil
    environment:
      - API_DESTINO=http://web:80 # conexion interna entre docker Backend y frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - web # dependencia con el backend para consultas endpoints

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sabitech_phpmyadmin
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # Buzón de pruebas: captura los correos que envía Laravel en local.
  # Se ven en http://localhost:8025 (el SMTP, puerto 1025, solo es accesible entre contenedores).
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  mysql_data:
  frontend_node_modules:
