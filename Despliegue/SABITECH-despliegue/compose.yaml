name: sabiteck-despliegue

services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app:/var/www/html

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sabiteck
      MYSQL_USER: sabiteck_user
      MYSQL_PASSWORD: Aula_Sabiteck_2026
      MYSQL_ROOT_PASSWORD: Aula_Root_2026
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sabiteck_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: Aula_Root_2026
    depends_on:
      - db

volumes:
  mysql_data:
